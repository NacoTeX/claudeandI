name: Echolot
version: "0.8.0"
slug: echolot
description: >-
  Self-hosted Wi-Fi CSI presence detection hub built on ESPectre — a
  license-free, open-source alternative to TOMMY.
url: "https://github.com/NacoTeX/claudeandI/tree/main/echolot"
arch:
  - aarch64
  - amd64
  - armv7
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:radar
panel_title: Echolot
webui: "http://[HOST]:[PORT:8099]/"
startup: application
boot: auto
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
