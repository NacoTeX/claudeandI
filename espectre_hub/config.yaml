name: ESPectre Hub
version: "0.4.0"
slug: espectre_hub
description: >-
  Self-hosted Wi-Fi CSI presence detection hub built on ESPectre — a
  license-free, open-source alternative to TOMMY.
url: "https://github.com/nacotex/test/tree/main/espectre_hub"
arch:
  - aarch64
  - amd64
  - armv7
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:radar
panel_title: ESPectre Hub
webui: "http://[HOST]:[PORT:8099]/"
startup: application
boot: auto
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
